  <circle cx="130" cy="130" r="108" fill="none" stroke="currentColor" stroke-width="4"/>
  <text fill="currentColor" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="3.2"><textPath href="#ring" startOffset="1%">MARTIN PARR • MUNDO PEQUENO •</textPath></text>
  <text x="130" y="121" text-anchor="middle" fill="currentColor" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" letter-spacing="2">VOCÊ ESTÁ</text>
  <text x="130" y="154" text-anchor="middle" fill="currentColor" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" letter-spacing="3">AQUI</text>
